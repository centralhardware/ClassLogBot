name: Android APK

# The native Android app (:androidApp over the shared Compose UI in app/): built on every change to either
# (or by hand), released from main.
on:
  push:
    branches: [ "main" ]
    paths: [ "app/**", "androidApp/**", "build.gradle.kts", "settings.gradle.kts", ".github/workflows/android.yml" ]
  pull_request:
    paths: [ "app/**", "androidApp/**", "build.gradle.kts", "settings.gradle.kts", ".github/workflows/android.yml" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      CLASSLOG_HOST: ${{ vars.CLASSLOG_HOST }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Without the secrets (forks, first run) the APK is debug-signed.
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/classlog.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/classlog.keystore" >> "$GITHUB_ENV"
          fi

      # The runner's preinstalled SDK (ANDROID_HOME) switches the Android target on.
      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon :androidApp:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: classlog-${{ env.VERSION_NAME }}
          path: androidApp/build/outputs/apk/release/*.apk

      - name: Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp androidApp/build/outputs/apk/release/*.apk classlog.apk
          gh release create "android-$VERSION_NAME" classlog.apk --target "$GITHUB_SHA" \
            --title "ClassLog Android $VERSION_NAME" --notes "API: https://$CLASSLOG_HOST/"
